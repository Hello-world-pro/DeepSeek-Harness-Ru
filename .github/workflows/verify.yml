name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild the client bundle
        run: node scripts/build-client.cjs
      - name: Fail when client.js is out of sync with data/
        run: git diff --exit-code -- client.js
      - name: Check the module in a test DOM
        run: node scripts/test-client.cjs
